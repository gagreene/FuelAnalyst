name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rsconnect-python
          pip install -r requirements.txt

      - name: Configure rsconnect
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect add \
            --account $SHINYAPPS_ACCOUNT \
            --name $SHINYAPPS_ACCOUNT \
            --token $SHINYAPPS_TOKEN \
            --secret $SHINYAPPS_SECRET

      - name: Deploy to shinyapps.io
        run: |
          rsconnect deploy shiny . \
            --account ${{ secrets.SHINYAPPS_ACCOUNT }} \
            --title Fuel-Analysis-Test \
            --verbose

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 App URL: https://${{ secrets.SHINYAPPS_ACCOUNT }}.shinyapps.io/fuel-analysis-test/"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
