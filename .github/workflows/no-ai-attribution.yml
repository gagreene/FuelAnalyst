name: No AI attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: no-ai-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Commit messages, PR title, and PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan the PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" | python scripts/check_ai_attribution.py --label "pull request title"
          printf '%s' "$PR_BODY" | python scripts/check_ai_attribution.py --label "pull request description"

      - name: Scan every commit message in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
              git log -1 --format=%B "$sha" | python scripts/check_ai_attribution.py --label "commit $sha" || status=1
          done
          exit $status
