name: Tests

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock matches pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Fail if uv.lock is out of date
        run: uv lock --check

  pytest:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Show the macOS version (the locked environment needs macOS 15 or newer)
        if: runner.os == 'macOS'
        run: sw_vers

      - name: Install the locked environment
        run: uv sync --locked --extra test --extra photoload

      - name: Run test suite
        run: uv run --locked --no-sync pytest -vv --basetemp="${{ runner.temp }}/pytest"

  pytest-minimum-deps:
    name: Minimum dependency floor (Python 3.11, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FuelAnalyst at the minimum dependency floor
        shell: bash
        run: |
          python -m pip install --upgrade pip
          cat <<'EOF' > constraints-min.txt
          numpy==1.23.2
          pandas==2.2.0
          scipy==1.10.0
          scikit-learn==1.1.3
          matplotlib==3.6.0
          geopandas==0.13.0
          rasterio==1.3.5
          pyproj==3.4.0
          shapely==2.0.0
          python-dateutil==2.8.2
          tqdm==4.64.0
          joblib==1.1.0
          flame-components==0.1.1
          pytest==7.0.0
          Pillow==9.2.0
          PyMuPDF==1.24.3
          scikit-image==0.20.0
          EOF
          python -m pip install -c constraints-min.txt -e ".[test,photoload]"

      - name: Run test suite
        run: python -m pytest -vv --basetemp="${{ runner.temp }}/pytest"

  pytest-fofem:
    name: pyFOFEM PyPI extra (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install the locked environment with the published pyfofem-fire-effects extra
        run: uv sync --locked --extra fofem --extra test --extra photoload

      - name: Run test suite against the installed pyfofem-fire-effects wheel
        run: uv run --locked --no-sync pytest -vv --basetemp="${{ runner.temp }}/pytest"

  wheel-smoke:
    name: Clean wheel install (no uv project, no source tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build the wheel
        run: uv build --no-sources --wheel --out-dir "${{ runner.temp }}/dist"

      - name: Install the wheel into an empty environment
        run: |
          uv venv --python 3.12 "${{ runner.temp }}/wheel-env"
          uv pip install --python "${{ runner.temp }}/wheel-env/bin/python" "${{ runner.temp }}"/dist/*.whl

      - name: Import the installed package from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          "${{ runner.temp }}/wheel-env/bin/python" - <<'EOF'
          import importlib.metadata as md
          import fuel_analyst
          from fuel_analyst._vendor import bcwft2018
          from fuel_analyst._vendor.conpyro import conpyro
          import flame_components
          assert "site-packages" in fuel_analyst.__file__, fuel_analyst.__file__
          assert not any(r.split()[0].lower() == "uv" for r in (md.requires("fuel-analyst") or []))
          print("OK", md.version("fuel-analyst"), fuel_analyst.__file__)
          EOF
