name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FuelAnalyst and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,photoload]"

      - name: Run test suite
        run: python -m pytest -vv --basetemp="${{ runner.temp }}/pytest"

  pytest-minimum-deps:
    name: Minimum dependency floor (Python 3.11, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FuelAnalyst at the minimum dependency floor
        shell: bash
        run: |
          python -m pip install --upgrade pip
          cat <<'EOF' > constraints-min.txt
          numpy==1.23.2
          pandas==2.2.0
          scipy==1.10.0
          scikit-learn==1.1.3
          matplotlib==3.6.0
          geopandas==0.13.0
          rasterio==1.3.5
          pyproj==3.4.0
          shapely==2.0.0
          python-dateutil==2.8.2
          tqdm==4.64.0
          joblib==1.1.0
          pytest==7.0.0
          Pillow==9.2.0
          PyMuPDF==1.24.3
          scikit-image==0.20.0
          EOF
          python -m pip install -c constraints-min.txt -e ".[test,photoload]"

      - name: Run test suite
        run: python -m pytest -vv --basetemp="${{ runner.temp }}/pytest"

  pytest-fofem:
    name: pyFOFEM PyPI extra (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FuelAnalyst with the published pyfofem-fire-effects extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fofem,test]"

      - name: Run test suite against the installed pyfofem-fire-effects wheel
        run: python -m pytest -vv --basetemp="${{ runner.temp }}/pytest"
