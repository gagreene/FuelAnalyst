services:
  fuel-analyst:
    build: .
    container_name: fuel-analyst-dev

    volumes:
      # Code (dev bind mount) — the ONLY thing under /app
      - .:/app
      # Data mounts live OUTSIDE /app so nothing nests inside the code mount
      - type: bind
        source: ${INPUT_DIR}
        target: /input_data
      - "C:/Users/ssmithtr/Desktop/CleanTest/Docker_Out:/output"
      - "D:/_NRCAN_Gridded_FWI_Data:/nrcan_data:ro"
      - "C:/Users/ssmithtr/Desktop/CleanTest/BEC_data:/BEC_data:ro"

    env_file:
      - ./.env
    working_dir: /app

    environment:
      DATA_BASE_DIR: /input_data
      DATA_SUBDIR: Survey123_Data
      OVERVIEW_FILES: /app/test_data/results
      BASE_FILES: /app/test_data
      NRCAN_DATA_DIR: /nrcan_data
      BEC_DATA_DIR: /BEC_data
      OUTPUT_DIR: /output
      OUTPUT_CHECK_DIR: /output/data_check
      OUTPUT_FuelAnalyst: /output/fuel_analyst
      OUTPUT_FBP: /output/fbp_fuel_typing
      OUTPUT_WX_EXTRACT: /output/wx_extract
      OUTPUT_CONPYRO: /output/conpyro
      GEN_CONPYRO: "True"
      GEN_FOFEM_TREE: "True"
      GEN_FOFEM_CONSUME: "True"

    stdin_open: true
    tty: true
    command: /bin/bash