services:
  fuel-analyst:
    build: .
    container_name: fuel-analyst-dev
    ## This is where you mount the data into the function
    volumes:
      - .:/app
      - "/s/Research_Labs/Daniels_Lab/NEW LAB DRIVE/Fire_Models/_NRCAN_Gridded_FWI_Data:/app/nrcan_data"
      - "/c/Users/ssmithtr/Desktop/SiteModels/FuelAnalyst_test_data/test_data_LLCF-WBFN_2026-04-14:/app/input_data"
      - "/c/Users/ssmithtr/Desktop/SiteModels/FuelAnalyst_output:/app/output"
    working_dir: /app
    ## this is where you define the way to call the data 
    environment:
      DATA_BASE_DIR: /app/input_data
      DATA_SUBDIR: Survey123_Dat
      # These files are defined and edited as part of the packages
      # Builds on results of prior runs
      OVERVIEW_FILES: /app/test_data/results
      # Files are a base dataframe to run rom 
      BASE_FILES: /app/test_data
      NRCAN_DATA_DIR: /app/weather_data
      ## output folders
      OUTPUT_FBP: /app/output/fbp_fuel_typing
      OUTPUT_FuelAnalyst: /app/output/fuel_analyst
      GEN_CONPYRO: "True"
      GEN_FOFEM_TREE: "True"
      GEN_FOFEM_CONSUME: "True"
    stdin_open: true
    tty: true
    command: /bin/bash

