[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-analyst"
version = "0.1.1"
description = "Forest fuel field data processing pipeline for BC wildfire analysis"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gregory A. Greene"},
]
keywords = ["fuel", "wildfire", "forestry", "FBP", "FOFEM", "British Columbia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23.2",
    "pandas>=2.2,<4",
    "scipy>=1.10",
    "geopandas>=0.13",
    "rasterio>=1.3.5",
    "pyproj>=3.4",
    # Direct floor on purpose: geopandas 0.13 alone would allow shapely 1.x.
    "shapely>=2.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.64",
    # Reads Survey123 Excel downloads. 3.1.5 is the floor pandas 3 requires (pandas>=2.2 also works with it).
    "openpyxl>=3.1.5",
    # Reads Survey123 file geodatabase downloads. geopandas<1.0 defaults to fiona, so declare pyogrio and call it directly.
    "pyogrio>=0.7.2",
    "flame-components>=0.1.1,<0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
photoload = [
    "matplotlib>=3.6",
    "Pillow>=9.2",
    "PyMuPDF>=1.24.3",
    "scikit-image>=0.20",
]
fofem = [
    "pyfofem-fire-effects>=0.1.2,<0.2",
]
all = [
    "fuel-analyst[fofem,photoload]",
]

[dependency-groups]
dev = [
    "build",
    "twine",
    "pytest>=7.0",
]
notebook = [
    "ipykernel",
    "ipywidgets",
    "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/gagreene/FuelAnalyst"
Repository = "https://github.com/gagreene/FuelAnalyst"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuel_analyst = [
    "supporting_data/*.csv",
    "supporting_data/*.json",
    "_vendor/*.py",
    "_vendor/conpyro/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests interactions between FuelAnalyst components",
    "regression: preserves behavior for confirmed defects",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "windows_fofem694: opt-in integration test against the real bundled FOFEM 6.9.4 runfofem.exe (Windows only; set FUEL_ANALYST_RUN_FOFEM694_TESTS=1 to enable)",
]
