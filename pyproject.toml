[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-analyst"
version = "0.1.0"
description = "Forest fuel field data processing pipeline for BC wildfire analysis"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gregory A. Greene", email = "map.n.trowel@gmail.com"},
]
keywords = ["fuel", "wildfire", "forestry", "FBP", "FOFEM", "British Columbia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "geopandas>=0.12",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "shapely>=2.0",
    "python-dateutil>=2.8",
    "tqdm>=4.64",
    "joblib>=1.1",
]

[project.optional-dependencies]
conpyro = [
    "conpyro @ git+https://github.com/gagreene/conpyro.git",
]
fofem = [
    "pyfofem @ git+https://github.com/gagreene/pyfofem.git",
]
all = [
    "fuel-analyst[conpyro,fofem]",
]
dev = [
    "build",
    "twine",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/gagreene/FuelAnalyst"
Repository = "https://github.com/gagreene/FuelAnalyst"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuel_analyst = [
    "supporting_data/*.csv",
    "supporting_data/*.json",
    "_vendor/*.py",
]
