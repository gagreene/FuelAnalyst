[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conpyro"
version = "0.1.0"
description = "Python implementation of the Canadian Fire Behaviour Prediction (FBP) System"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gregory A. Greene", email = "map.n.trowel@gmail.com"},
]
keywords = ["fire behaviour", "FBP", "Canada", "wildfire", "conpyro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/gagreene/conpyro"
Repository = "https://github.com/gagreene/conpyro"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
